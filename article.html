<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>VOICE OF PRESIDENT ― 記事</title>
<script>
  // Legacy entry point for old-style links: article.html?id=XXXX
  // Articles now live at clean URLs under /articles/<id>.
  (() => {
    const id = new URLSearchParams(location.search).get('id');
    location.replace(id ? '/articles/' + encodeURIComponent(id) : '/archive');
  })();
</script>
</head>
<body>
<p>記事ページへ移動しています。移動しない場合は<a href="/archive">連載一覧</a>からお探しください。</p>
</body>
</html>
